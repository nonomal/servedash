<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- rounded dark background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- four panel cards, mosaic layout, one color each -->
  <!-- top-left big: yellow -->
  <rect x="116" y="116" width="150" height="120" rx="20" fill="#fbbf24"/>
  <!-- top-right small: green -->
  <rect x="288" y="116" width="108" height="120" rx="20" fill="#34d399"/>
  <!-- bottom-left small: blue -->
  <rect x="116" y="258" width="108" height="138" rx="20" fill="#3b82f6"/>
  <!-- bottom-right big: purple -->
  <rect x="246" y="258" width="150" height="138" rx="20" fill="#8b5cf6"/>

  <!-- status dots -->
  <circle cx="146" cy="146" r="11" fill="#0d1117"/>
  <circle cx="276" cy="288" r="11" fill="#0d1117"/>
</svg>
